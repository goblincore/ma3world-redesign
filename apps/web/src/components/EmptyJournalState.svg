<svg viewBox="0 0 400 300" class="w-full max-w-sm mx-auto mb-8" xmlns="http://www.w3.org/2000/svg">
  <!-- Define Gradients and Gauges -->
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdfbf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f0e6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Book Instance -->
  <g transform="translate(100, 150)" filter="url(#shadow)">
    <!-- Cover/Back -->
    <path d="M 0,0 Q 100,-20 200,0 L 200,100 Q 100,120 0,100 Z" fill="#4a5568" />
    <!-- Pages -->
    <path class="page-flutter" d="M 5,5 Q 100,-10 195,5 L 195,95 Q 100,105 5,95 Z" fill="url(#bookGradient)">
      <animate attributeName="d" 
        values="M 5,5 Q 100,-10 195,5 L 195,95 Q 100,105 5,95 Z;
                M 5,5 Q 100,-15 195,5 L 195,95 Q 100,110 5,95 Z;
                M 5,5 Q 100,-10 195,5 L 195,95 Q 100,105 5,95 Z" 
        dur="4s" repeatCount="indefinite" />
    </path>
    <!-- Middle Spine Shadow -->
    <line x1="100" y1="0" x2="100" y2="110" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  <!-- Owl -->
  <g transform="translate(220, 80)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#71717a" />
    <!-- Belly -->
    <ellipse cx="0" cy="10" rx="25" ry="30" fill="#e4e4e7" />
    
    <!-- Ears/Tufts -->
    <path d="M -35,-40 L -20,-60 L -5,-45 Z" fill="#71717a" />
    <path d="M 35,-40 L 20,-60 L 5,-45 Z" fill="#71717a" />

    <!-- Eyes -->
    <g class="owl-eyes">
      <!-- Left Eye -->
      <circle cx="-15" cy="-15" r="12" fill="white" />
      <circle cx="-15" cy="-15" r="6" fill="#18181b">
        <animate attributeName="ry" values="6;0.5;6" dur="5s" repeatCount="indefinite" begin="0s" />
      </circle>
      
      <!-- Right Eye -->
      <circle cx="15" cy="-15" r="12" fill="white" />
      <circle cx="15" cy="-15" r="6" fill="#18181b">
        <animate attributeName="ry" values="6;0.5;6" dur="5s" repeatCount="indefinite" begin="0.2s" />
      </circle>
    </g>

    <!-- Beak -->
    <path d="M 0,-5 L -5,5 L 5,5 Z" fill="#f59e0b" />

    <!-- Wings (resting) -->
    <path d="M -40,-10 Q -55,10 -40,30" stroke="#52525b" stroke-width="3" fill="none" />
    <path d="M 40,-10 Q 55,10 40,30" stroke="#52525b" stroke-width="3" fill="none" />
  </g>

  <!-- Floating particles -->
  <circle cx="50" cy="50" r="2" fill="#d4d4d8" opacity="0.5">
    <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="350" cy="100" r="1.5" fill="#d4d4d8" opacity="0.5">
    <animate attributeName="cy" values="100;110;100" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
